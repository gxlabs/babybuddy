# Example docker-compose for a standalone Baby Buddy deployment.
# Copy to docker-compose.override.yml or edit in place for your setup.
services:
  babybuddy:
    build: .
    container_name: babybuddy
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent data lives here (SQLite DB + uploaded media).
      - ./data:/data
    environment:
      DATABASE_URL: sqlite:////data/db.sqlite3
      MEDIA_ROOT: /data/media
      DJANGO_SETTINGS_MODULE: babybuddy.settings.production
      ALLOWED_HOSTS: "*"
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(50))"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
